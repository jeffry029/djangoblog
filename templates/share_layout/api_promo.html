{% load i18n %}
<a href="https://api.zdabc.icu/"
   target="_blank"
   rel="noopener sponsored"
   aria-label="{% trans 'View API relay service' %}"
   class="group mb-8 flex flex-col gap-3 rounded-lg border border-primary-600/15 bg-card/80 px-4 py-3 text-sm shadow-sm transition-colors hover:border-primary-600/35 hover:bg-secondary/50 sm:flex-row sm:items-center sm:justify-between">
    <span class="flex min-w-0 flex-col gap-1 sm:flex-row sm:items-center sm:gap-3">
        <span class="inline-flex w-fit shrink-0 rounded-md bg-primary-600/10 px-2 py-1 text-[12px] font-semibold leading-none text-primary-600">
            {% trans 'API relay' %}
        </span>
        <span class="min-w-0 leading-6 text-muted-foreground">
            <span class="font-medium text-foreground">{% trans 'Lower-cost access to full models' %}</span>
            <span class="mx-1 text-border">/</span>
            {% trans 'Full GPT-5.5 0.3R = $1, full Claude Opus 4.8 1R = $1' %}
        </span>
    </span>
    <span class="inline-flex shrink-0 items-center gap-1 text-[13px] font-semibold text-primary-600 transition-colors group-hover:text-primary-500">
        {% trans 'View now' %}
        <svg class="size-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 17L17 7M9 7h8v8"/>
        </svg>
    </span>
</a>
